# # BisqueCore - Pylons development environment configuration
#
# The %(here)s variable will be replaced with the parent directory of this file
#
# This file is for deployment specific config options -- other configuration
# that is always required for the app is done in the config directory,
# and generally should not be modified by end users.

# Variabled defined by startservers
#  host: an unadorned FQDN hostname
#  port: the server port
#  url : The full url of the server

[DEFAULT]

[server:main]
use = egg:Paste#http
host = localhost
port = 8080


[app:main]
use = config:site.cfg
sqlalchemy.url = sqlite:///./test1.db
skip_authentication = true



[test]
host.root= http://localhost:8080
host.user= admin
host.password= admin

[store]
samples_url= http://vrl-4090.ece.ucsb.edu:8080/samples/
input_dir= /tmp/test_inputs
results_dir= /tmp/test_results
files= test1.jpg
