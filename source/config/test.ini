#
# BisqueCore - TurboGears 2 testing environment configuration
#
# The %(here)s variable will be replaced with the parent directory of this file
#
[DEFAULT]
debug = true

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:site.cfg
full_stack = true
bisque.image_service.local_dir = test-imagedir
bisque.image_service.work_dir = test-workdir

# Add additional test specific configuration options as necessary.
[app:main_without_authn]
use = main
skip_authentication = True

[test]
host.root= http://vrl-4090.ece.ucsb.edu:8080
host.user= admin
host.password= admin

[store]
samples_url= http://vrl-4090.ece.ucsb.edu:8080/samples/
input_dir= /tmp/test_inputs
results_dir= /tmp/test_results
files= test1.jpg



